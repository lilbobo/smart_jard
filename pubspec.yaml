name: smart_jard
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  # تم حذف google_fonts من هنا
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  vibration: ^2.0.1
  cupertino_icons: ^1.0.8
  mobile_scanner: ^5.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.2.2
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/beep.mp3
    - assets/icon.png
    - assets/logo.png  # تأكد من إضافة اللوجو هنا أيضاً إذا كان موجوداً في assets

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-Regular.ttf
        - asset: fonts/Cairo-Bold.ttf
          weight: 700